<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Wi-Fi</title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
    var error = "$(error)";
    if (error == "user $(username) has reached uptime limit" ||
        error == "akun Wi-Fi $(username) sudah mencapai batas waktu") {
        window.location.href = "./expired.html";
    }
</script>
<body>
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
        <input type="hidden" name="username">
        <input type="hidden" name="password">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">
    </form>
    <script src="md5.js"></script>
    <script>
        function doLogin() {
            document.sendin.username.value = document.login.username.value;
            document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
            document.sendin.submit();
            return false;
        }
    </script>
    $(endif)

    <main class="container-login">
        <header class="brand-header">
            <div class="logo" aria-hidden="true"><img src="./logo.avif" alt="" onerror="this.style.display='none'"></div>
            <h1 class="title">Login</h1>
            <p class="sub-title">Masukkan akun untuk melanjutkan.</p>
        </header>

        <form class="custom-fields" name="login" autocomplete="off"
              action="$(link-login-only)" method="post"
              $(if chap-id) onsubmit="return doLogin()" $(endif)>
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">
            <div class="field-group">
                <label class="field-label" for="username">Username</label>
                <input id="username" type="text" name="username" value="$(username)"
                       placeholder="Masukkan username" required autofocus>
            </div>
            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <input id="password" type="password" name="password"
                       placeholder="Masukkan password" required>
            </div>
            <button class="btn-submit" type="submit">Masuk ke Wi-Fi</button>
        </form>

        $(if trial == 'yes')
        <div class="trial">
            <span>Tidak punya akun?</span>
            <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">Coba gratis 5 menit</a>
        </div>
        $(endif)
        $(if error)
        <div class="notice" role="alert">$(error)</div>
        $(endif)

        <div class="link"><a href="https://ricoagista.my.id" target="_blank" rel="noopener">ricoagista.my.id</a></div>
    </main>
</body>
</html>
