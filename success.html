<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Berhasil terhubung</title>
    <link rel="stylesheet" href="style.css">
    $(if refresh-timeout)
    <script>setTimeout(function () { location.href = './status'; }, 4000);</script>
    $(endif)
</head>
<body>
    <main class="container-login">
        <header class="brand-header">
            <div class="logo" aria-hidden="true"><img src="./logo.avif" alt="" onerror="this.style.display='none'"></div>
            <h1 class="title">Terhubung</h1>
            $(if login-by == 'trial')
            <p class="sub-title">Trial aktif selama 5 menit.</p>
            $(elif login-by != 'mac')
            <p class="sub-title">Login berhasil.</p>
            $(else)
            <p class="sub-title">Koneksi aktif.</p>
            $(endif)
        </header>
        <div class="menu-items"><div class="row-items"><div class="title-success">Koneksi siap digunakan.</div></div></div>
        <button class="btn-submit" type="button" onclick="location.href='./status.html'">Lihat status koneksi</button>
        <div class="link"><a href="https://ricoagista.my.id" target="_blank" rel="noopener">ricoagista.my.id</a></div>
    </main>
</body>
</html>
