<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logout Wi-Fi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-login">
        <header class="brand-header">
            <div class="logo" aria-hidden="true"><img src="./logo.avif" alt="" onerror="this.style.display='none'"></div>
            <h1 class="title">Sesi selesai</h1>
            <p class="sub-title">Anda telah keluar.</p>
        </header>
        <div class="menu-items">
            <div class="row-items"><span class="item-label">Terhubung selama</span><span class="item-value">$(uptime)</span></div>
            <div class="row-items"><span class="item-label">Upload</span><span class="item-value">$(bytes-in-nice)</span></div>
            <div class="row-items"><span class="item-label">Download</span><span class="item-value">$(bytes-out-nice)</span></div>
        </div>
        <form class="logout-form" action="$(link-login)" name="login" method="get">
            <button class="btn-submit" type="submit">Masuk kembali</button>
        </form>
        <div class="link"><a href="https://ricoagista.my.id" target="_blank" rel="noopener">ricoagista.my.id</a></div>
    </main>
</body>
</html>
