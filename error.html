<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotspot error</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-login">
        <header class="brand-header">
            <div class="logo" aria-hidden="true"><img src="./logo.avif" alt="" onerror="this.style.display='none'"></div>
            <h1 class="title">Terjadi kendala</h1>
            <p class="sub-title">Hotspot tidak dapat menyelesaikan permintaan ini.</p>
        </header>
        <div class="notice" role="alert">$(error)</div>
        <a class="btn-submit" href="$(link-login)" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:16px">Kembali ke login</a>
    </main>
</body>
</html>
